blueprint_name: slurm-cluster

vars:
  project_id: rangelands-explo-1571664594580
  deployment_name: slurm-cluster
  region: us-central1
  zone: us-central1-c
  network_name: vpc-net
  subnetwork_name: vpc-primary-subnet
  custom_image:
    name: rangelands-hpc-base-20250317t160501z
    project: $(vars.project_id)
  disk_size: 100
  
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: rangelands-hpc

deployment_groups:
- group: primary
  modules:
  - id: network1
    source: modules/network/pre-existing-vpc
    settings:
        project_id: $(vars.project_id)
        region: $(vars.region)
        network_name: $(vars.network_name)
        subnetwork_name: $(vars.subnetwork_name)

- group: cluster
  modules:
  - id: compute_node_group
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use:
      - network1
    settings:
      node_count_dynamic_max: 100
      machine_type: n2-standard-2
      instance_image: $(vars.custom_image)
      instance_image_custom: true
      disk_size_gb: $(vars.disk_size)
      preemptible: true
      enable_spot_vm: true
      spot_instance_config:
        termination_action: "STOP"

  - id: compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - compute_node_group
    settings:
      partition_name: compute

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use:
    - network1
    settings:
      machine_type: n2-standard-2
      instance_image: $(vars.custom_image)
      instance_image_custom: true

      disk_type: pd-standard
      disk_size_gb: $(vars.disk_size)
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network1
    - compute_partition
    - slurm_login
    settings:
      machine_type: c2-standard-4
      instance_image: $(vars.custom_image)
      instance_image_custom: true
      disk_type: pd-ssd
      disk_size_gb: $(vars.disk_size)
